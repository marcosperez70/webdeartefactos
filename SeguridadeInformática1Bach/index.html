const done=l=>l.every(x=>x.k in R),sc=l=>l.filter(x=>R[x.k]).length;
function theme(){const d=document.documentElement,dk=d.dataset.theme?d.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dk?'light':'dark';try{localStorage.setItem('segtheme',d.dataset.theme)}catch(e){}}
const stats=()=>'<div class="stats">'+[[MODS.length,'módulos'],[4,'niveis'],[MODS.length,'bloques de actividades'],[EX.length,'preguntas de exame']].map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')+'</div>';
function head(){const t=ALL.flat().length+EX.length,n=Object.keys(R).length;return`<header><button class="pill" data-act="go" data-v="map">Mapa</button><button class="pill" data-act="go" data-v="exam"${ALL.every(done)?'':' disabled'}>Exame</button><button class="pill" data-act="go" data-v="dip"${done(EX)?'':' disabled'}>Diploma</button><button class="pill" data-act="theme">Claro ou escuro</button></header><div class="bar" title="Progreso total"><i style="width:${n/t*100}%"></i></div>`}
function start(){return`<h1>Seguridade informática</h1><p class="lead">Un mapa de aprendizaxe para avaliar as túas competencias dixitais de seguridade, co temario de TIC I.</p>${stats()}<div class="card"><label for="nm"><b>O teu nome</b> (aparecerá no diploma)</label><br><input id="nm" value="${esc(St.name)}" autocomplete="name"><p class="mu">Cada proba resposta unha soa vez. Non hai repeticións: o teu informe final reúne todos os resultados.</p><button class="pill p" data-act="start">Comezar</button></div>`}
function map(){let h=`<h1>Ola, ${esc(St.name)}</h1><p class="lead">Completa os módulos en orde. Todos puntúan no teu informe final.</p>${stats()}`;
LV.forEach((L,l)=>{h+=`<section class="node"><h2>Nivel ${l+1}: ${L}</h2><div class="lv">`;MODS.forEach((M,i)=>{if(M.l!=l)return;const a=ALL[i],n=a.filter(x=>x.k in R).length,lk=i&&!done(ALL[i-1]);
h+=`<div class="card"><h3>${M.n}</h3><p class="mu">Competencia DigComp ${CP[M.c][0]}. ${n} de ${a.length} respondidas${done(a)?', '+sc(a)+' acertos':''}.</p><button class="pill p" data-act="mod" data-i="${i}"${lk?' disabled':''}>${lk?'Bloqueado':done(a)?'Ver resultado':n?'Continuar':'Comezar'}</button></div>`});h+='</div></section>'});
const am=ALL.every(done);return h+`<section class="node"><h2>Exame final</h2><div class="card"><p>${EX.length} preguntas: a metade son retos avanzados de ordenar e clasificar. Unha soa oportunidade.</p><button class="pill p" data-act="go" data-v="exam"${am?'':' disabled'}>${am?(done(EX)?'Ver resultado':'Comezar exame'):'Remata antes os módulos'}</button></div></section>`}
function fb(x,ex){if(ex)return'<p class="fb">Resposta rexistrada. O resultado aparecerá no teu informe.</p>';const ok=R[x.k];let s='';
if(!ok)s=' Solución: '+(x.y=='t'?x.o[x.a]:x.y=='c'?x.it.map((v,i)=>v+' → '+x.cn[x.a[i]]).join('; '):x.st.join(' → '));return`<p class="fb ${ok?'ok':'no'}">${ok?'✓ Correcto':'✗ Incorrecto.'+s}</p>`}
function item(x,ex){const an=x.k in R,t=T[x.k]||[];let h=`<p class="q">${x.q}</p>`;
if(x.y=='t')h+='<div class="opts">'+x.o.map((o,j)=>`<button class="pill${an&&!ex&&j==x.a?' ok':''}" data-act="opt" data-j="${j}"${an?' disabled':''}>${o}</button>`).join('')+'</div>';
else if(x.y=='c'){h+=x.it.map((v,r)=>`<div class="row"><span>${v}</span><span class="g">`+x.cs.map(c=>`<button class="pill${t[r]===c?' sel':''}" data-act="pick" data-r="${r}" data-c="${c}"${an?' disabled':''}>${x.cn[c]}</button>`).join('')+'</span></div>').join('');
if(!an)h+=`<p><button class="pill p" data-act="chk"${x.it.some((_,r)=>t[r]==null)?' disabled':''}>Comprobar</button></p>`}
else{h+='<div class="g">'+x.sh.map(j=>`<button class="pill" data-act="put" data-j="${j}"${an||t.includes(j)?' disabled':''}>${x.st[j]}</button>`).join('')+'</div><ol class="seq">'+t.map((j,p)=>`<li><button class="pill sel" data-act="rm" data-p="${p}"${an?' disabled':''}>${x.st[j]}</button></li>`).join('')+'</ol>';
if(!an)h+=`<button class="pill p" data-act="chk"${t.length<x.st.length?' disabled':''}>Comprobar a orde</button>`}
return h+(an?fb(x,ex):'')}
function mod(){const ex=V.v=='exam',l=ex?EX:ALL[V.i],ti=ex?'Exame final':MODS[V.i].n;
if(V.c>=l.length){const s=sc(l);return`<h1>${ti}</h1><div class="card"><p class="big">${s} de ${l.length} acertos</p><p class="mu">${ex?'Nota do exame: '+(s/l.length*10).toFixed(1)+' sobre 10.':'Este resultado xa forma parte do teu informe final.'}</p><button class="pill p" data-act="go" data-v="${ex?'dip':'map'}">${ex?'Ver informe e diploma':'Volver ao mapa'}</button></div>`}
const x=l[V.c];return`<h2>${ti}</h2><p class="mu">${ex?'Pregunta':'Actividade'} ${V.c+1} de ${l.length}${x.y!='t'?', reto avanzado':''}</p><div class="card">${item(x,ex)}${x.k in R?`<p><button class="pill p" data-act="next">${V.c+1<l.length?'Continuar':'Ver resultado'}</button></p>`:''}</div>`}
function rep(){const mods=MODS.map((M,i)=>{const a=ALL[i],e=EX.filter(x=>x.m==i);return{n:M.n,a:sc(a),at:a.length,e:sc(e),et:e.length,g:sc(a)+sc(e),t:a.length+e.length}});
const cps=CP.map((c,ci)=>{let g=0,t=0;mods.forEach((m,i)=>{if(MODS[i].c==ci){g+=m.g;t+=m.t}});return{id:c[0],n:c[1],p:g/t}}),al=ALL.flat().concat(EX);return{mods,cps,ex:sc(EX)/EX.length*10,gl:sc(al)/al.length*10}}
function dip(){const r=rep(),pc=v=>Math.round(v*100)+' %';
return`<div class="card"><h1>Diploma</h1><p>Certifícase que <b>${esc(St.name)}</b> completou o curso de seguridade informática o ${new Date(St.fin||Date.now()).toLocaleDateString('gl-ES')}.</p><div class="stats"><div><b>${r.ex.toFixed(1)}</b><span>Nota do exame sobre 10</span></div><div><b>${r.gl.toFixed(1)}</b><span>Nota global sobre 10</span></div></div>
<h2>Competencias dixitais (DigComp)</h2>${r.cps.map(c=>`<div class="row"><span>${c.id} ${c.n}</span><span class="fb ${c.p>=.6?'ok':'no'}">${c.p>=.6?'✓ Superada':'✗ Non superada'}, ${pc(c.p)}</span></div>`).join('')}<p class="mu">Unha competencia supérase cun 60 % ou máis de acertos en todas as súas probas.</p>
<h2>Resultados por lección</h2>${r.mods.map(m=>`<div class="row"><span>${m.n}</span><span>Actividades ${m.a}/${m.at}, exame ${m.e}/${m.et}, total ${pc(m.g/m.t)}</span></div>`).join('')}</div><button class="pill p noprint" data-act="print">Imprimir ou gardar en PDF</button>`}
function render(){$('#app').innerHTML=V.v=='start'?start():head()+(V.v=='map'?map():V.v=='dip'&&done(EX)?dip():mod())}
const first=l=>{const c=l.findIndex(x=>!(x.k in R));return c<0?l.length:c};
function fin(x,ok){R[x.k]=ok?1:0;if(done(EX)&&!St.fin)St.fin=Date.now();save()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset,a=d.act,x=V.v=='mod'?ALL[V.i][V.c]:V.v=='exam'?EX[V.c]:null;let up=0;
if(a=='theme'){theme();return}if(a=='print'){print();return}
if(a=='start'){const n=$('#nm').value.trim();if(!n){$('#nm').focus();return}St.name=n;save();V={v:'map'};up=1}
else if(a=='go'){V=d.v=='exam'?{v:'exam',c:first(EX)}:{v:d.v};up=1}
else if(a=='mod'){V={v:'mod',i:+d.i,c:first(ALL[+d.i])};up=1}
else if(a=='next'){V.c++;up=1}
else if(a=='opt')fin(x,+d.j==x.a);
else if(a=='chk'){const t=T[x.k]||[];fin(x,x.y=='c'?x.a.every((v,i)=>t[i]===v):t.every((j,p)=>j===p))}
else if(a=='pick')(T[x.k]=T[x.k]||[])[+d.r]=+d.c;
else if(a=='put')(T[x.k]=T[x.k]||[]).push(+d.j);
else if(a=='rm')T[x.k].splice(+d.p,1);
render();if(up)scrollTo(0,0)});
if(St.name)V={v:'map'};render();
</script></body></html>
