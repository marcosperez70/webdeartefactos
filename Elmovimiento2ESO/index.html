<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>El Movimiento · Física y Química 2º ESO</title>

<style>
:root{--bg:#fff;--ink:#3c3c3b;--mut:#6b6b68;--lm:#a9c64a;--dg:#5c7a1f;--ct:#f1f3e1;--bd:#d9e0b8;--sf:#fff;--gd:#e6eacf;--bl:#5c7a1f;--gr:#5c7a1f;--am:#a86a00;--rd:#c4412d;--bt:#3c3c3b;--btx:#fff;--hero:#3c3c3b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#232322;--ink:#f2f2ea;--mut:#b3b3a8;--ct:#31351f;--bd:#4a5035;--sf:#2e2e2c;--gd:#3a3d30;--bl:#b9d65f;--gr:#7fa32c;--am:#ffc247;--rd:#ff8a75;--bt:#a9c64a;--btx:#232322;--hero:#2b2b2a}}
:root[data-theme="dark"]{--bg:#232322;--ink:#f2f2ea;--mut:#b3b3a8;--ct:#31351f;--bd:#4a5035;--sf:#2e2e2c;--gd:#3a3d30;--bl:#b9d65f;--gr:#7fa32c;--am:#ffc247;--rd:#ff8a75;--bt:#a9c64a;--btx:#232322;--hero:#2b2b2a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Helvetica Neue",Helvetica,Arial,sans-serif}
.w{max-width:1180px;margin:0 auto;padding:0 24px}main{max-width:820px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:2rem;line-height:1.1;margin:.2em 0;font-weight:500}h2{font-size:1.35rem;margin:.2em 0 .4em}h3{font-size:1.15rem;margin:0;line-height:1.2}
.top{border-bottom:1px solid var(--bd);background:var(--sf)}.top .w{display:flex;justify-content:space-between;align-items:center;padding-top:10px;padding-bottom:10px}
.lg{display:flex;gap:12px;align-items:center;line-height:1.25;font-size:.9rem}.lg b{font-size:.95rem}.v{width:46px;height:46px;border-radius:50%;background:#3c3c3b;color:var(--lm);display:grid;place-items:center;font-weight:700;font-size:1.5rem}
button.nv{background:none;color:var(--ink);border:0;border-bottom:4px solid var(--lm);border-radius:0;font-size:1.05rem;padding:8px 2px}
.hero{background:var(--hero);color:#fff;padding:52px 0 60px}.hg{display:grid;grid-template-columns:1.15fr 1fr;gap:36px;align-items:center}
.hero h1{font-size:clamp(2.6rem,7vw,4.8rem);font-weight:400;margin:.1em 0 .25em}.hero em{font-style:normal;color:var(--lm)}
.eb{color:var(--lm);letter-spacing:.12em;font-weight:700;font-size:.85rem;margin:0}.eb2{color:var(--dg);letter-spacing:.12em;font-weight:700;font-size:.85rem;margin:0}
.lead{font-size:1.35rem;line-height:1.4;margin:0 0 14px}.sub{color:#cfcfc8;margin:0 0 24px}
button.cta{background:var(--lm);color:#2b2b2a;border:0;border-radius:10px;padding:14px 22px;font-size:1.05rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.t{border:1px solid #55583f;background:#474746;color:#fff;border-radius:24px;padding:20px;text-align:left;display:block;font-weight:400;font-size:.95rem}
.t b{font-size:clamp(1.3rem,3vw,2rem);font-weight:400;display:block;overflow-wrap:anywhere;margin-bottom:6px}.t.big{grid-column:1/-1;background:var(--lm);color:#2b2b2a;border-color:var(--lm);cursor:default}.t.big b{font-size:3rem}
.sec{padding-top:48px;padding-bottom:60px}h2.big{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:400;margin:.1em 0 .4em}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px;margin-top:18px}
.card{background:var(--ct);border:1px solid var(--bd);border-top:10px solid var(--lm);border-radius:24px;padding:20px}
.ch{display:flex;gap:14px;align-items:center}.lt{flex:none;width:46px;height:46px;background:var(--sf);border-radius:12px;display:grid;place-items:center;color:var(--dg);font-weight:700;font-size:1.2rem}
.cf{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--bd);padding-top:14px;margin-top:14px;font:.85rem ui-monospace,Menlo,monospace}
.box{background:var(--ct);border:1px solid var(--bd);border-radius:20px;padding:18px;margin:14px 0}
img{max-width:100%;height:auto;display:block;margin:10px auto;border-radius:8px;background:#fff}
button,input{font:inherit;color:inherit}
button{background:var(--bt);color:var(--btx);border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:700}
button.s{background:var(--sf);color:var(--ink);border:1.5px solid var(--ink)}button:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--lm);outline-offset:2px}
input[type=text]{width:7em;padding:7px 10px;border:1.5px solid var(--dg);border-radius:10px;background:var(--sf)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.mut{color:var(--mut)}
.bar{height:10px;background:var(--gd);border-radius:5px;overflow:hidden;flex:1;min-width:90px}.bar i{display:block;height:100%;background:var(--gr);border-radius:5px}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.dots b{width:28px;height:28px;border:1.5px solid var(--bd);border-radius:50%;font-size:.75rem;display:grid;place-items:center;cursor:pointer;background:var(--sf)}
.dots .ok{background:var(--gr);color:#fff}.dots .hf{background:var(--am);color:#fff}.dots .no{background:var(--rd);color:#fff}.dots .cu{outline:3px solid var(--lm)}
.hint{border-left:6px solid var(--lm);padding:6px 12px;background:var(--gd);border-radius:0 10px 10px 0;margin:10px 0}
.ok-t{color:var(--gr);font-weight:700}.no-t{color:var(--rd);font-weight:700}
.tag{font-size:.8rem;border:1.5px solid var(--dg);color:var(--dg);border-radius:12px;padding:1px 8px;margin-right:4px}
.f{margin:8px 0}.opt{display:block;margin:6px 0;cursor:pointer}details summary{cursor:pointer}
.dip{border:10px double var(--lm);border-radius:20px;text-align:center;padding:28px 18px;background:var(--sf)}.dip .n{font-size:3rem;font-weight:700;color:var(--dg)}
@media(max-width:760px){.hg{grid-template-columns:1fr}}
@media print{body{background:#fff;color:#000}.np,.top{display:none!important}}

function vals(){const r=document.querySelector("input[name=o]:checked");return r?[+r.value]:[...document.querySelectorAll(".fi")].map(e=>e.value)}

X("t",[1,2,4],"Un balón sale hacia arriba a 25 m/s (g = 10). Calcula la altura máxima y el tiempo de subida.",[["h máxima",31.25,"m",.3],["t de subida",2.5,"s",.05]],["En el punto más alto la velocidad es 0.","t = v0 / g.","h = v0·t − ½·g·t²."]),
X("t",[1,2,4],"Una piedra se lanza hacia arriba a 50 m/s (g = 10). Calcula la altura máxima y el tiempo de subida.",[["h máxima",125,"m",1],["t de subida",5,"s",.05]],["En el punto más alto la velocidad es 0.","t = v0 / g.","h = v0·t − ½·g·t²."]),
X("t",[1,2,4],"Una flecha se lanza hacia arriba a 35 m/s (g = 10). Calcula la altura máxima y el tiempo de subida.",[["h máxima",61.25,"m",.5],["t de subida",3.5,"s",.05]],["En el punto más alto la velocidad es 0.","t = v0 / g.","h = v0·t − ½·g·t²."]),
X("g",[5,4,2],"Gráfica de la autoevaluación. Calcula la aceleración en cada tramo: I (0–5 s), II (5–20 s), III (20–30 s) y IV (30–40 s).",[["Tramo I",2,"m/s²",.05],["Tramo II",0,"m/s²",.05],["Tramo III",1,"m/s²",.05],["Tramo IV",-2,"m/s²",.05]],G3,"ag1"),
X("g",[5,4,2],"Gráfica del control. Calcula la aceleración en cada tramo: I (0–5 s), II (5–20 s), III (20–25 s) y IV (25–40 s).",[["Tramo I",1,"m/s²",.05],["Tramo II",0,"m/s²",.05],["Tramo III",-0.4,"m/s²",.05],["Tramo IV",0.47,"m/s²",.03]],G3,"cg1"),
X("g",[5,4,2],"Calcula la aceleración en el primer tramo (5→10 m/s en 10 s), en el tramo horizontal y en el último (10→0 m/s en 10 s).",[["Primer tramo",0.5,"m/s²",.05],["Tramo horizontal",0,"m/s²",.05],["Último tramo",-1,"m/s²",.05]],G3,"v1"),
X("g",[5,4,2],"Calcula la aceleración en 0–4 s, 4–6 s, 6–9 s y 10–12 s.",[["0–4 s",1,"m/s²",.05],["4–6 s",0,"m/s²",.05],["6–9 s",-2,"m/s²",.05],["10–12 s",1,"m/s²",.05]],G3,"v2")];
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]),pk=(k,n)=>sh(P.map((p,i)=>i).filter(i=>P[i].k===k)).slice(0,n),gl=n=>n>=9?"Sobresaliente":n>=7?"Notable":n>=6?"Bien":n>=5?"Suficiente":"Insuficiente";
function newTest(){S.run={ids:sh([...pk("m",4),...pk("c",2),...pk("t",2),...pk("g",2)]),i:0,r:{}};save();go("ev")}
function ev(){const R=S.run;
if(!R)return`<p class="np"><button class="s" onclick="go('home')">← Inicio</button></p><h1>Autoevaluación</h1><div class="box"><p>10 ejercicios al azar: 4 de M.R.U.A. (de tus pruebas), 2 de caída libre, 2 de tiro vertical y 2 de gráficas. Puedes repetirla las veces que quieras y no necesitas haber hecho los módulos.</p><p><b>Ayuda paso a paso:</b> puedes abrirla en cualquier ejercicio, pero ese ejercicio suma 0.</p><div class="row"><button onclick="newTest()">Empezar autoevaluación</button>${(S.t||[]).length?`<button class="s" onclick="go('evr')">Ver último informe</button>`:""}</div></div>`;
const a=R.ids,i=a[R.i],q=P[i],s=R.r[i]||{},n=s.h||0,d=s.d,fin=a.every(j=>(R.r[j]||{}).d);
const dots=a.map((j,x)=>{const t=R.r[j]||{};return`<b class="${t.d?(t.p?"ok":"no"):""} ${x===R.i?"cu":""}" onclick="evGo(${x})">${x+1}</b>`}).join("");
const body=q.f.map((f,x)=>`<div class="f"><label>${f[0]} = <input class="fi" type="text" inputmode="decimal" value="${esc((s.a&&s.a[x])||"")}" ${d?"disabled":""}> ${f[2]}</label></div>`).join("");
const sol=q.f.map(f=>`${f[0]}: ${fm(f[1])} ${f[2]}`).join(" · ");
return`<p class="np"><button class="s" onclick="go('home')">← Inicio</button></p><h2>Autoevaluación · ejercicio ${R.i+1} de 10</h2><div class="dots">${dots}</div><div class="box"><p><b>${q.t}</b></p>${q.img?`<img src="${IMG[q.img]}" alt="Gráfica del ejercicio">`:""}${body}
${q.s.slice(0,n).map((t,x)=>`<div class="hint"><b>Paso ${x+1}:</b> ${t}</div>`).join("")}
${d?`<p class="${s.p?"ok-t":"no-t"}">${s.p?"¡Correcto! +1 punto":(n?"Con ayuda no puntúa. ":"")+"Solución: "+sol}</p>`:n?`<p class="no-t">Has usado la ayuda: este ejercicio suma 0.</p>`:""}
<div class="row">${d?"":`<button onclick="evCheck()">Comprobar</button>`}${!d&&n<q.s.length?`<button class="s" onclick="evHelp()">${n?"Siguiente paso":"Ayuda paso a paso (suma 0)"}</button>`:""}${R.i>0?`<button class="s" onclick="evGo(${R.i-1})">Anterior</button>`:""}${R.i<9?`<button class="s" onclick="evGo(${R.i+1})">Siguiente</button>`:""}${fin?`<button onclick="evEnd()">Ver informe</button>`:""}</div></div>`}
function evGo(x){S.run.i=x;save();render();scrollTo(0,0)}
function evHelp(){const R=S.run,i=R.ids[R.i],s=R.r[i]||{};R.r[i]={a:vals(),h:(s.h||0)+1};save();render()}
function evCheck(){const R=S.run,i=R.ids[R.i],s=R.r[i]||{},v=vals();if(v.every(x=>!x.trim()))return;R.r[i]={a:v,h:s.h||0,d:1,p:(!s.h&&ok(P[i],v))?1:0};save();render()}
function evEnd(){const R=S.run,ca={};let pts=0;R.ids.forEach(i=>{const p=R.r[i].p||0;pts+=p;P[i].c.forEach(c=>{const x=ca[c]=ca[c]||[0,0];x[0]+=p;x[1]++})});S.t=(S.t||[]).concat([{d:new Date().toLocaleDateString("es-ES"),p:pts,ca}]);S.run=null;save();go("evr")}
function evr(){const H=S.t||[],L=H[H.length-1];if(!L)return ev();
return`<p class="np"><button class="s" onclick="go('home')">← Inicio</button></p><h1>Informe de la autoevaluación</h1><div class="box"><h2>Nota: <span style="color:var(--bl)">${fm(L.p)} / 10</span> · ${gl(L.p)}</h2><p class="mut" style="margin:0">Intento del ${L.d}. Mejor nota: ${fm(Math.max(...H.map(h=>h.p)))} · Intentos: ${H.length}</p></div>
<div class="box"><h2>Competencias</h2>${Object.keys(CA).map(c=>{const x=L.ca[c],p=x?Math.round(x[0]/x[1]*100):0,l=x?lvl(p):["Sin datos","var(--mut)"];return`<div style="margin:12px 0"><b>${CA[c][0]}</b> ${CA[c][1]}<div class="row"><div class="bar"><i style="width:${p}%;background:${l[1]}"></i></div><b style="color:${l[1]}">${x?p+"% · ":""}${l[0]}</b></div></div>`}).join("")}</div>
<div class="box"><h2>Historial</h2>${H.map((h,x)=>`<div class="row"><span style="flex:1">Intento ${x+1} · ${h.d}</span><b>${fm(h.p)} / 10</b></div>`).join("")}</div>
<div class="row np"><button onclick="newTest()">Repetir con ejercicios nuevos</button><button class="s" onclick="window.print()">Imprimir</button></div>`}

render();
</script></body></html>
