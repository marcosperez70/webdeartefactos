X.forEach((x,i)=>{M[i].e=x.e;M[i].o.push(...x.o);M[i].q.push(...x.q)});
const en=x=>`<p class=mu>📋 ${M[x.m].e}</p>`;
const L=[['Nivel 1 · Fundamentos',0,3],['Nivel 2 · Colaboración',3,6],['Nivel 3 · Gestión',6,9],['Nivel 4 · Integración',9,11]];
const $=s=>document.querySelector(s),sh=a=>{a=[...a];for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let S={r:{}},v='map',run=null;try{S=Object.assign(S,JSON.parse(localStorage.getItem('dg')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('dg',JSON.stringify(S))}catch(e){}};
try{const t=localStorage.getItem('dgt');if(t)document.documentElement.dataset.theme=t}catch(e){}
const mo=(m,i)=>{const[t,s]=m.o[i].split('::');return{k:'o',t,s:s.split('|'),c:m.c[0],m:M.indexOf(m)}},mq=(m,i)=>{const[t,...o]=m.q[i].split('|');return{k:'q',t,o,c:m.c[1],m:M.indexOf(m)}};
const pc=id=>S.r[id].reduce((s,x)=>s+x[1],0)/S.r[id].length,all=()=>M.every((_,i)=>S.r['m'+i]);
const go=x=>{v=x;run=null;render()};
function nav(){$('#nav').innerHTML=['map|Mapa','rep|Informe','dip|Diploma'].map(x=>{const[a,b]=x.split('|');return`<button class="nv ${v==a?'on':''}" ${live()?'disabled':''} onclick="go('${a}')">${b}</button>`}).join('')+`<button class="pill" onclick="tema()">◐</button>`}
function tema(){const d=document.documentElement,dk=getComputedStyle(d).colorScheme=='dark';d.dataset.theme=dk?'light':'dark';try{localStorage.setItem('dgt',d.dataset.theme)}catch(e){}}
function render(){nav();const m=$('#m');
if(!S.name){m.innerHTML=`<div class=card><h1>Curso de competencias digitales</h1><p class=mu>Antes de empezar, escribe tu nombre completo. Aparecerá en tu informe y en tu diploma.</p><input id=nm placeholder="Nombre y apellidos"><br><button class="pill pri" onclick="setN()">Empezar</button></div>`;return}
if(v=='test')return show();if(v=='rep')return rep();if(v=='dip')return dip();
const dn=M.filter((_,i)=>S.r['m'+i]).length+(S.r.x?1:0),p=Math.round(dn/12*100);
m.innerHTML=`<section class=hero><div><div class=eb>Curso de competencia digital</div><h1>Mapa de <em>aprendizaje</em></h1><p class=lead>Hola, ${S.name}. Evalúa tus competencias digitales con Google Workspace y consigue tu informe y tu diploma.</p><p class=sm>Cada prueba se puede hacer una sola vez y todas cuentan para tu informe final.</p><button class=lime onclick="document.getElementById('mod').scrollIntoView({behavior:'smooth'})">Ver los módulos ↓</button></div>
<div class=hr><div class="st big"><b>11</b>módulos</div><div class=st><b>4</b>niveles</div><div class=st><b>32</b>bloques de actividades</div><div class="st wide"><b>50</b>preguntas del examen</div><div class="st wide"><div class=row style="justify-content:space-between;margin:0 0 8px"><span>Progreso</span><span>${p}%</span></div><div class=bar><i style="width:${p}%"></i></div></div></div></section>
<div id=mod class=eb2>Módulos</div><h2 class=h2>Todos los módulos</h2>`+
L.map(([t,a,b],n)=>`<h2 class=lv>${t}</h2><div class=grid>`+M.slice(a,b).map((x,j)=>{const i=a+j,d=S.r['m'+i];return`<div class="card mc"><div class=ct><span class=ic>${i+1}</span><div><h3>${x.n}</h3><span class=mu>${C[x.c[0]]}</span></div></div><div class=cf><code>DigComp ${x.c.join(' · ')}</code>${d?`<span class="pill ${pc('m'+i)>=.6?'ok':'ko'}">${Math.round(pc('m'+i)*100)}%</span>`:`<button class=dk onclick="ini('m${i}')">Hacer la prueba →</button>`}</div></div>`}).join('')+'</div>').join('')+
`<h2 class=lv>Examen final</h2><div class="card mc"><div class=ct><span class=ic>★</span><div><h3>50 preguntas: 25 de ordenar y 25 de test</h3><span class=mu>Se desbloquea al completar los 11 módulos.</span></div></div><div class=cf><code>Examen</code>${S.r.x?`<span class="pill ${pc('x')>=.6?'ok':'ko'}">Nota ${(pc('x')*10).toFixed(1)}/10</span>`:`<button class=dk ${all()?'':'disabled'} onclick="ini('x')">Empezar examen →</button>`}</div></div>`}
function setN(){const n=$('#nm').value.trim();if(n.length<3)return;S.name=n;save();render()}
function ini(id){if(S.r[id])return;$('#m').innerHTML=`<div class=card><h1>${id=='x'?'Examen final':'Módulo '+(+id.slice(1)+1)}</h1><p>Solo puedes hacer esta prueba <b>una vez</b>: no se podrá repetir. ¿Empezar ahora?</p><div class=row><button class="pill pri" onclick="beg('${id}')">Empezar</button><button class=pill onclick="go('map')">Cancelar</button></div></div>`}
function beg(id){if(S.r[id])return;let it;
if(id=='x'){const O=M.flatMap(m=>m.o.map((_,i)=>mo(m,i))),Q=M.flatMap(m=>m.q.map((_,i)=>mq(m,i)));it=sh([...sh(O).slice(0,25),...sh(Q).slice(0,25)])}
else{const m=M[+id.slice(1)];it=sh([...m.o.map((_,i)=>mo(m,i)),...m.q.map((_,i)=>mq(m,i))])}
S.r[id]=it.map(i=>[i.c,0]);S.tm=S.tm||{};S.tm[id]={s:Date.now()};save();run={id,it,i:0};v='test';try{document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}render()}
function show(){const{it,i,id}=run;nav();if(i>=it.length){S.tm[id].e=S.tm[id].e||Date.now();save();try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}const f=id=='x'?'Examen':'Módulo '+(+id.slice(1)+1);$('#m').innerHTML=`<div class=card><h1>${f} completado</h1><p>Resultado: <b>${Math.round(pc(id)*100)}%</b> (${(pc(id)*10).toFixed(1)}/10)</p><div class=row><button class="pill pri" onclick="go('map')">Volver al mapa</button><button class=pill onclick="go('rep')">Ver informe</button></div></div>`;return}
const x=it[i],h=`<div class=card><span class=tag>${id=='x'?'Examen':'Módulo '+(+id.slice(1)+1)} · ${i+1}/${it.length}</span><div class=bar style="margin:8px 0"><i style="width:${i/it.length*100}%"></i></div>`;
if(x.k=='q'){$('#m').innerHTML=h+en(x)+`<h3>${x.t}</h3><div class=opts>${sh(x.o).map(o=>`<button class=pill onclick="aq(this,${o==x.o[0]})">${o}</button>`).join('')}</div><div id=fb></div></div>`;return}
x.pool=sh(x.s.map((_,k)=>k));x.pl=[];ord()}
function ord(){const x=run.it[run.i],h=`<div class=card><span class=tag>${run.id=='x'?'Examen':'Módulo '+(+run.id.slice(1)+1)} · ${run.i+1}/${run.it.length} · Ordena los pasos</span><div class=bar style="margin:8px 0"><i style="width:${run.i/run.it.length*100}%"></i></div>`;
$('#m').innerHTML=h+en(x)+`<h3>Tarea: ${x.t}</h3><p class=mu>Toca los pasos en el orden correcto. Toca uno colocado para quitarlo.</p><div class=opts>${x.pl.map((k,n)=>`<button class="pill on" onclick="rm(${n})">${n+1}. ${x.s[k]}</button>`).join('')}</div><hr style="border:0;border-top:1px solid var(--bd)"><div class=opts>${x.pool.filter(k=>!x.pl.includes(k)).map(k=>`<button class=pill onclick="pk(${k})">${x.s[k]}</button>`).join('')}</div><button class="pill pri" ${x.pl.length<x.s.length?'disabled':''} onclick="ao()">Comprobar</button><div id=fb></div></div>`}
function pk(k){run.it[run.i].pl.push(k);ord()}function rm(n){run.it[run.i].pl.splice(n,1);ord()}
function fin(s,html){S.r[run.id][run.i][1]=s;save();$('#fb').innerHTML=html+`<div class=row><button class="pill pri" onclick="run.i++;show()">Siguiente</button></div>`}
function aq(b,ok){const bs=[...b.parentNode.children],x=run.it[run.i];bs.forEach(e=>{e.disabled=true;if(e.textContent==x.o[0])e.classList.add('ok')});if(!ok)b.classList.add('ko');fin(ok?1:0,`<p>${ok?'¡Correcto!':'Incorrecto. La respuesta válida está en verde.'}</p>`)}
function ao(){const x=run.it[run.i],n=x.s.length,c=x.pl.filter((k,j)=>k==j).length;$('#m').querySelectorAll('.opts button,.pri').forEach(e=>e.disabled=true);
fin(c/n,`<p>${c}/${n} pasos en su sitio. Orden correcto:</p><div class=opts>${x.s.map((s,j)=>`<span class="pill ${x.pl[j]==j?'ok':'ko'}">${j+1}. ${s}</span>`).join('')}</div>`)}
function comp(){const a={};Object.values(S.r).forEach(r=>r.forEach(([c,s])=>{a[c]=a[c]||[0,0];a[c][0]+=s;a[c][1]++}));return a}
function rep(){const a=comp(),g=Object.values(S.r).flat(),tot=g.length?g.reduce((s,x)=>s+x[1],0)/g.length:0;
$('#m').innerHTML=`<h1>Informe de competencias</h1><p class=mu>${S.name} · conjunto de todas las pruebas realizadas</p><div class=stats><div class=card><b>${(tot*10).toFixed(1)}</b>nota global /10</div><div class=card><b>${S.r.x?(pc('x')*10).toFixed(1):'–'}</b>nota del examen</div><div class=card><b>${Object.values(a).filter(x=>x[0]/x[1]>=.6).length}/${Object.keys(C).length}</b>competencias superadas</div></div>
<div class=card><h3>Competencias DigComp</h3><table>${Object.keys(C).map(k=>{const x=a[k],p=x?x[0]/x[1]:null;return`<tr><td><b>${k}</b> ${C[k]}<div class=bar style="margin-top:4px"><i style="width:${(p||0)*100}%"></i></div></td><td style="text-align:right;white-space:nowrap">${p==null?'<span class=mu>pendiente</span>':`${Math.round(p*100)}% <span class="pill ${p>=.6?'ok':'ko'}" style="padding:2px 10px">${p>=.6?'superada':'no superada'}</span>`}</td></tr>`}).join('')}</table></div>
<div class=card><h3>Resultados por prueba</h3><table>${M.map((m,i)=>`<tr><td>Módulo ${i+1} · ${m.n}</td><td style="text-align:right">${S.r['m'+i]?Math.round(pc('m'+i)*100)+'%'+ex('m'+i):'<span class=mu>pendiente</span>'}</td></tr>`).join('')}<tr><td><b>Examen final</b></td><td style="text-align:right">${S.r.x?Math.round(pc('x')*100)+'%'+ex('x'):'<span class=mu>pendiente</span>'}</td></tr></table></div>`}
function dip(){if(!(S.r.x&&all())){$('#m').innerHTML=`<div class=card><h1>Diploma</h1><p class=mu>Se emite al completar los 11 módulos y el examen final.</p></div>`;return}
const a=comp(),g=Object.values(S.r).flat(),tot=g.reduce((s,x)=>s+x[1],0)/g.length;
$('#m').innerHTML=`<div class="card dip"><div class=mu>DIPLOMA DE COMPETENCIAS DIGITALES</div><p>Se certifica que</p><h1>${S.name}</h1><p>ha completado los 11 módulos y el examen final con una nota global de <b>${(tot*10).toFixed(1)}/10</b> (examen: ${(pc('x')*10).toFixed(1)}/10).</p><h3 style="margin-top:20px">Informe de competencias</h3><table style="text-align:left">${Object.keys(C).map(k=>{const p=a[k][0]/a[k][1];return`<tr><td><b>${k}</b> ${C[k]}</td><td style="text-align:right">${Math.round(p*100)}% · ${p>=.6?'Superada':'No superada'}</td></tr>`}).join('')}</table><p class=mu>${new Date().toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'})}</p></div><button class="pill pri noprint" onclick="print()">Imprimir o guardar en PDF</button>`}
const live=()=>v=='test'&&run&&run.i<run.it.length;
const fmt=ms=>{const s=Math.floor(ms/1000),p=n=>String(n).padStart(2,'0');return(s>=3600?p(s/3600|0)+':':'')+p(s%3600/60|0)+':'+p(s%60)};
const ex=id=>{const t=S.tm&&S.tm[id],o=S.o&&S.o[id]||0;return` <span class=mu>· ${t&&t.e?fmt(t.e-t.s):'–'} · ${o} salidas</span>`};
['contextmenu','copy','cut','paste','selectstart','dragstart'].forEach(e=>document.addEventListener(e,ev=>{if(live())ev.preventDefault()}));
document.addEventListener('keydown',ev=>{if(live()&&(((ev.ctrlKey||ev.metaKey)&&/^[acvxpsu]$/i.test(ev.key))||ev.key=='F12'||ev.key=='PrintScreen'))ev.preventDefault()});
let away=0;
const lose=()=>{if(live()&&!away){away=1;S.o=S.o||{};S.o[run.id]=(S.o[run.id]||0)+1;save()}};
const back=()=>{if(away){away=0;if(live())banner()}};
function banner(){const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class=card style="max-width:420px"><h3>Has salido de la ventana</h3><p>Durante una prueba no se puede cambiar de pestaña ni de aplicación. La salida n.º ${S.o[run.id]} queda registrada en tu informe.</p><button class="pill pri">Continuar</button></div>`;d.querySelector('button').onclick=()=>d.remove();document.body.appendChild(d)}
addEventListener('blur',lose);addEventListener('focus',back);
document.addEventListener('visibilitychange',()=>document.hidden?lose():back());
addEventListener('beforeunload',e=>{if(live()){e.preventDefault();e.returnValue=''}});
setInterval(()=>{const c=$('#clk'),l=live();document.body.classList.toggle('lock',!!l);if(l&&S.tm&&S.tm[run.id]){c.hidden=false;c.textContent='⏱ '+fmt(Date.now()-S.tm[run.id].s)}else c.hidden=true},500);
render();
</script></body></html>
